name: Build 서랍정리 APK

on:
  push:
    paths:
      - 'SeorapJeongri/**'
      - '.github/workflows/build-seorapjeongri.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeorapJeongri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seorapjeongri-debug-apk
          path: SeorapJeongri/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
